<section id="intro" class="card"><div class="art"><div class="orb"></div></div><h2>心の扉をひらこう</h2><p>静かな夜、不思議な世界に迷い込んだあなた。目の前に現れる選択肢から、いちばん惹かれるものを選んで進もう。<br>正解も不正解もないよ。深く考えず、最初に心が動いた答えを選んでね。</p><button class="primary" id="start">旅をはじめる ✦</button><div class="note">全10問・所要時間 約2〜3分</div></section>

{name:"暁の旅人",art:3,sub:"希望を見つけて前へ進む、情熱の人",icon:"☀",color:"#ffe0b5",desc:"あなたの心の奥には、現状を少しずつ変えていきたい力があります。迷いながらも、自分なりの一歩を踏み出せるタイプ。大切なものを守るときには、思っている以上の強さを発揮します。",strength:"魅力は、行動力と前向きさ。小さな一歩を積み重ねて、道を切り開いていけます。",message:"いつも強くいなくて大丈夫。立ち止まる時間も、次の一歩の力になるよ。"},

{name:"虹の紡ぎ手",art:5,sub:"人と人の間に彩りを生み出す人",icon:"✺",color:"#f5c9e5",desc:"あなたの心の奥には、違う考えや個性をつなぎ、新しい可能性を生み出す柔らかさがあります。何気ない会話や小さな出来事から、心が弾むきっかけを見つけるタイプ。",strength:"魅力は、発想力と共感力。場に新しい風を運び、周りの人の良さを引き出せます。",message:"誰かと違うところこそ、あなたらしい色。大切に育てていこう。"}

let n=0,ans=[],current=null;const $=id=>document.getElementById(id);
function screen(id){["intro","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function drawQ(){let q=qs[n];$("counter").textContent=`QUESTION ${n+1} / 10`;$("pct").textContent=`${(n+1)*10}%`;$("fill").style.width=`${(n+1)*10}%`;$("qnum").textContent=`QUESTION ${String(n+1).padStart(2,"0")}`;$("question").textContent=q[0];$("choices").replaceChildren();q[1].forEach((v,i)=>{let b=document.createElement("button");b.className="choice";let s=document.createElement("span");s.className="letter";s.textContent="ABCD"[i];b.append(s,document.createTextNode(v));b.onclick=()=>{ans.push(i);n++;n<10?drawQ():finish()};$("choices").append(b)})}
function finish(){let counts=[0,0,0,0,0,0];ans.forEach((v,i)=>counts[(v*2+i*3)%6]++);current=types[counts.indexOf(Math.max(...counts))];$("symbol").textContent=current.icon;$("symbol").style.color=current.color;$("resultArt").src=artImages[current.art];$("title").textContent=current.name;$("sub").textContent=current.sub;$("desc").textContent=current.desc;$("strength").textContent=current.strength;$("message").textContent=current.message;screen("result")}

let audioCtx=null, musicOn=false, masterGain=null, musicNodes=[];
function startMusic(){
 if(musicOn)return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;
 audioCtx=audioCtx||new AC(); if(audioCtx.state==="suspended")audioCtx.resume();
 masterGain=audioCtx.createGain();masterGain.gain.value=0.0001;masterGain.connect(audioCtx.destination);
 const now=audioCtx.currentTime;masterGain.gain.setTargetAtTime(0.035,now,1.2);
 // Soft original ambient pad: slow, gentle layered tones; no external audio or tracking.
 [[174.61,0.10],[261.63,0.07],[349.23,0.045],[440.00,0.025]].forEach(([freq,vol],i)=>{
   const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();
   osc.type=i===0?"sine":"triangle";osc.frequency.value=freq;filter.type="lowpass";filter.frequency.value=850;
   gain.gain.value=vol;osc.connect(filter);filter.connect(gain);gain.connect(masterGain);osc.start();musicNodes.push(osc);
 });
 musicOn=true; $("musicToggle").textContent="♫ BGM：ON";
}
function stopMusic(){
 if(!audioCtx||!musicOn)return;
 masterGain.gain.setTargetAtTime(0.0001,audioCtx.currentTime,.25);
 musicOn=false;$("musicToggle").textContent="♫ BGM：OFF";
}
$("musicToggle").addEventListener("click",()=>musicOn?stopMusic():startMusic());

$("start").onclick=()=>{startMusic();n=0;ans=[];screen("quiz");drawQ()};$("retry").onclick=()=>{n=0;ans=[];screen("intro")};
async function cardBlob(){return new Promise(async resolve=>{let c=document.createElement("canvas");c.width=1080;c.height=1350;let x=c.getContext("2d"),g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,"#394477");g.addColorStop(.55,"#171e42");g.addColorStop(1,"#090e23");x.fillStyle=g;x.fillRect(0,0,1080,1350);let seed=19;function r(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<150;i++){x.beginPath();x.arc(r()*1080,r()*1350,r()*3+1,0,7);x.fillStyle=`rgba(255,255,255,${.2+r()*.7})`;x.fill()}let m=x.createRadialGradient(360,350,10,360,350,200);m.addColorStop(0,"#fffbe7");m.addColorStop(.55,"#e8dfbb");m.addColorStop(1,"#9b9cc8");x.fillStyle=m;x.beginPath();x.arc(360,350,175,0,7);x.fill();x.fillStyle="#20264d";x.beginPath();x.arc(450,290,164,0,7);x.fill();let art=new Image();art.src=artImages[current.art];await new Promise(resolve=>{art.onload=resolve;art.onerror=resolve});x.save();x.beginPath();x.rect(90,470,900,310);x.clip();x.drawImage(art,90,470,900,310);x.restore();x.textAlign="center";x.fillStyle="#f3dca4";x.font="30px sans-serif";x.fillText("YOUR INNER WORLD",540,700);x.fillStyle="#fff";x.font="bold 70px sans-serif";x.fillText(current.name,540,825);x.fillStyle=current.color;x.font="34px sans-serif";x.fillText(current.sub,540,900);x.fillStyle="#d8daf0";x.font="29px sans-serif";x.fillText("月明かりの心の旅｜深層心理テスト",540,1120);x.fillStyle="#b8bddc";x.font="25px sans-serif";x.fillText("あなたの心にある、小さな光。",540,1185);x.strokeStyle="#eee6ff77";x.lineWidth=2;x.strokeRect(42,42,996,1266);c.toBlob(resolve,"image/png")})}
function download(blob){let u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="月明かりの心の旅_診断結果.png";a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
$("save").onclick=async()=>download(await cardBlob());
$("share").onclick=async()=>{let b=await cardBlob(),f=new File([b],"kokoro-shindan.png",{type:"image/png"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"月明かりの心の旅",text:`私の診断結果は「${current.name}」でした ✦`});return}catch(e){if(e.name==="AbortError")return}}download(b);alert("診断画像を保存したよ！写真アプリからXの投稿に添付してね。")};
$("post").onclick=()=>{let t=`私の深層心理タイプは「${current.name}」でした ✦\n${current.sub}\nあなたも診断してみてね！\n${location.href}\n#月明かりの心の旅 #心理テスト`;window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t),"_blank","noopener")};
