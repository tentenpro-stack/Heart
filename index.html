<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152f"><title>月明かりの心の旅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#394477,#171d40 48%,#090e23);color:#f7f4ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:28px 14px 40px}.head{text-align:center;padding:8px 0 22px}.moon{width:82px;height:82px;margin:0 auto 16px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fffde9,#e8ddb5 48%,#8c91c5);box-shadow:0 0 45px #d9d4ff88}.eyebrow{color:#f0d99e;letter-spacing:.25em;font-size:11px}h1{font:500 38px/1.3 Georgia,serif;letter-spacing:.1em;margin:10px 0}p{color:#c9cce5;line-height:1.9;font-size:14px}.card{background:#1b2349dc;border:1px solid #cbd0ff2c;border-radius:22px;padding:22px;box-shadow:0 18px 50px #0005}.art{height:120px;border-radius:16px;background:linear-gradient(140deg,#46518c,#252c5a,#5b507f);display:grid;place-items:center;margin-bottom:18px;overflow:hidden}.orb{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffbe1,#d6c99d 55%,#9a9bc9);box-shadow:0 0 40px #fff5}.primary,.choice,.secondary{font:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:14px;padding:16px;background:linear-gradient(100deg,#a7a1e8,#e4c8df);color:#171936;font-weight:700;margin-top:12px}.secondary{border:1px solid #d5d8ff44;border-radius:13px;background:#ffffff12;color:#fff;padding:14px}.progress{display:flex;justify-content:space-between;color:#c9cce5;font-size:12px}.bar{height:5px;background:#fff2;border-radius:9px;margin:10px 0 24px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#aaa5ff,#f5dda0);width:10%}.qnum{font-size:11px;color:#f0d99e;letter-spacing:.2em}.question{font-size:20px;line-height:1.7;margin:10px 0 18px}.choices{display:grid;gap:10px}.choice{text-align:left;color:#fff;background:#ffffff0c;border:1px solid #d5d8ff33;border-radius:13px;padding:15px;line-height:1.6}.choice:active{background:#a9a2ed33}.letter{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#b9b3ff24;color:#f0d99e;margin-right:9px}.result{text-align:center}.symbol{font-size:58px;color:#e8e1ff;margin:10px}.result h2{font-size:27px;margin:0}.sub{color:#f0d99e}.desc{text-align:left;background:#ffffff0b;border:1px solid #ffffff20;border-radius:15px;padding:16px;margin:18px 0}.desc p{margin:0 0 10px}.desc p:last-child{margin:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.hidden{display:none!important}.note{text-align:center;font-size:10px;color:#9da5ca;margin-top:15px}
</style></head><body><main class="wrap"><header class="head"><div class="moon"></div><div class="eyebrow">A JOURNEY INTO YOUR INNER WORLD</div><h1>月明かりの<br>心の旅</h1><p>10の問いをたどって、まだ知らない自分に出会う。<br>直感で選んでね。</p></header>
<section id="intro" class="card"><div class="art"><div class="orb"></div></div><h2>心の扉をひらこう</h2><p>静かな夜、不思議な世界に迷い込んだあなた。目の前に現れる選択肢から、いちばん惹かれるものを選んで進もう。<br>正解も不正解もないよ。深く考えず、最初に心が動いた答えを選んでね。</p><button class="primary" id="start">旅をはじめる ✦</button><div class="note">全10問・所要時間 約2〜3分</div></section>
<section id="quiz" class="card hidden"><div class="progress"><span id="counter">QUESTION 1 / 10</span><span id="pct">10%</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="qnum" id="qnum"></div><h2 class="question" id="question"></h2><div class="choices" id="choices"></div></section>
<section id="result" class="card result hidden"><div class="eyebrow">YOUR INNER WORLD</div><div class="symbol" id="symbol"></div><h2 id="title"></h2><p class="sub" id="sub"></p><div class="desc"><p id="desc"></p><p id="strength"></p><p id="message"></p></div><button class="primary" id="share">診断結果を画像でシェア ✦</button><div class="actions"><button class="secondary" id="save">画像を保存</button><button class="secondary" id="post">Xに結果を投稿</button></div><button class="secondary" id="retry" style="width:100%;margin-top:10px">もう一度診断する</button><div class="note">※楽しむためのエンタメ診断です。医学的・心理学的な診断ではありません。</div></section><div class="note">© 月明かりの心の旅</div></main>
<script>
const qs=[
["夜の森で、ひとつだけ光る道を見つけました。どの道を進む？",["月明かりに照らされた白い道","小さな花が咲く緑の道","星が降るような青い道","遠くに灯りが見える金色の道"]],
["泉のほとりに贈り物が置かれています。何を手に取る？",["中身のわからない小箱","透き通ったガラスの小瓶","古い鍵","一輪の青い花"]],
["空に大きな扉が浮かんでいます。向こうにありそうなのは？",["穏やかな海","懐かしい街並み","見たことのない世界","あたたかな誰かのいる場所"]],
["不思議な鳥が肩にとまりました。どうする？",["そっと手を差し出す","しばらく様子を見る","話しかけてみる","一緒に空へ飛び立つ"]],
["旅の途中、古い時計を見つけました。針はどこを指している？",["夜明けの少し前","真昼の12時","夕暮れどき","真夜中の12時"]],
["4つの宝石。惹かれる色は？",["深い青","やわらかな桃色","森のような緑","夕焼けのような琥珀色"]],
["誰もいない広場に音楽が聞こえてきました。どんな音？",["静かなピアノ","軽やかな鈴の音","力強い太鼓","風のような笛の音"]],
["空から一枚の羽が舞い降りました。何色？",["純白","銀色","淡い紫","深い藍色"]],
["旅の最後に小さな灯台が見えます。あなたは？",["灯りを頼りにまっすぐ進む","周りの景色を眺めてから進む","灯台に誰かいるか確かめる","少し離れて星空を見上げる"]],
["心の旅を終えるとき、胸に残る感覚は？",["安心とぬくもり","好奇心とわくわく","静けさと自由","希望と決意"]]
];
const types=[
{name:"月光の守り人",sub:"やさしさを灯す、静かな強さの人",icon:"☾",color:"#e8e1ff",desc:"あなたの心の奥には、誰かの小さな変化に気づける繊細さがあります。場の空気を感じ取り、相手が安心できる場所をつくろうとするタイプ。控えめに見えても、内側には揺るがない芯を持っています。",strength:"魅力は、急がずに相手の気持ちを受け止められること。そばにいるだけで安心を感じる人もいそうです。",message:"誰かを照らすことと同じくらい、自分の心にも休む時間をあげてね。"},
{name:"星屑の探究者",sub:"未知の景色に心をひらく、自由な人",icon:"✧",color:"#c9e7ff",desc:"あなたの心の奥には、まだ見ぬ可能性を探したい気持ちがあります。決められた道だけでは物足りず、小さな発見にも胸が躍るタイプ。変化を恐れず、自分なりの答えを見つけていきます。",strength:"魅力は、好奇心と柔軟さ。人が見過ごすものの中にも、新しい価値を見つけられます。",message:"遠回りに見える経験も、きっとあなたらしい景色につながっているよ。"},
{name:"森の癒やし手",sub:"ぬくもりを育てる、穏やかな人",icon:"❋",color:"#c9f0d9",desc:"あなたの心の奥には、調和やつながりを大切にする思いがあります。派手さよりも、日々の小さな幸せや信頼を育てることに喜びを感じるタイプ。心地よくいられる場所を大切にします。",strength:"魅力は、誠実さと安定感。小さな約束を大切にする姿勢が、信頼につながります。",message:"いつも周りを大切にするように、自分の望みも大切にしていいんだよ。"},
{name:"暁の旅人",sub:"希望を見つけて前へ進む、情熱の人",icon:"☀",color:"#ffe0b5",desc:"あなたの心の奥には、現状を少しずつ変えていきたい力があります。迷いながらも、自分なりの一歩を踏み出せるタイプ。大切なものを守るときには、思っている以上の強さを発揮します。",strength:"魅力は、行動力と前向きさ。小さな一歩を積み重ねて、道を切り開いていけます。",message:"いつも強くいなくて大丈夫。立ち止まる時間も、次の一歩の力になるよ。"},
{name:"深海の賢者",sub:"静けさの奥に深い洞察を秘めた人",icon:"◈",color:"#b9d9f5",desc:"あなたの心の奥には、物事の表面だけで判断せず、本質を見つめようとする力があります。ひとりで考える時間を大切にし、自分なりに納得してから進みたいタイプ。",strength:"魅力は、観察力と落ち着き。複雑な状況でも、一歩引いて全体を見渡せます。",message:"答えを急がなくて大丈夫。あなたのペースで見つけた答えを信じてね。"},
{name:"虹の紡ぎ手",sub:"人と人の間に彩りを生み出す人",icon:"✺",color:"#f5c9e5",desc:"あなたの心の奥には、違う考えや個性をつなぎ、新しい可能性を生み出す柔らかさがあります。何気ない会話や小さな出来事から、心が弾むきっかけを見つけるタイプ。",strength:"魅力は、発想力と共感力。場に新しい風を運び、周りの人の良さを引き出せます。",message:"誰かと違うところこそ、あなたらしい色。大切に育てていこう。"}
];
let n=0,ans=[],current=null;const $=id=>document.getElementById(id);
function screen(id){["intro","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function drawQ(){let q=qs[n];$("counter").textContent=`QUESTION ${n+1} / 10`;$("pct").textContent=`${(n+1)*10}%`;$("fill").style.width=`${(n+1)*10}%`;$("qnum").textContent=`QUESTION ${String(n+1).padStart(2,"0")}`;$("question").textContent=q[0];$("choices").replaceChildren();q[1].forEach((v,i)=>{let b=document.createElement("button");b.className="choice";let s=document.createElement("span");s.className="letter";s.textContent="ABCD"[i];b.append(s,document.createTextNode(v));b.onclick=()=>{ans.push(i);n++;n<10?drawQ():finish()};$("choices").append(b)})}
function finish(){let counts=[0,0,0,0,0,0];ans.forEach((v,i)=>counts[(v*2+i*3)%6]++);current=types[counts.indexOf(Math.max(...counts))];$("symbol").textContent=current.icon;$("symbol").style.color=current.color;$("title").textContent=current.name;$("sub").textContent=current.sub;$("desc").textContent=current.desc;$("strength").textContent=current.strength;$("message").textContent=current.message;screen("result")}
$("start").onclick=()=>{n=0;ans=[];screen("quiz");drawQ()};$("retry").onclick=()=>{n=0;ans=[];screen("intro")};
function cardBlob(){return new Promise(resolve=>{let c=document.createElement("canvas");c.width=1080;c.height=1350;let x=c.getContext("2d"),g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,"#394477");g.addColorStop(.55,"#171e42");g.addColorStop(1,"#090e23");x.fillStyle=g;x.fillRect(0,0,1080,1350);let seed=19;function r(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<150;i++){x.beginPath();x.arc(r()*1080,r()*1350,r()*3+1,0,7);x.fillStyle=`rgba(255,255,255,${.2+r()*.7})`;x.fill()}let m=x.createRadialGradient(360,350,10,360,350,200);m.addColorStop(0,"#fffbe7");m.addColorStop(.55,"#e8dfbb");m.addColorStop(1,"#9b9cc8");x.fillStyle=m;x.beginPath();x.arc(360,350,175,0,7);x.fill();x.fillStyle="#20264d";x.beginPath();x.arc(450,290,164,0,7);x.fill();x.textAlign="center";x.fillStyle="#f3dca4";x.font="30px sans-serif";x.fillText("YOUR INNER WORLD",540,700);x.fillStyle="#fff";x.font="bold 70px sans-serif";x.fillText(current.name,540,825);x.fillStyle=current.color;x.font="34px sans-serif";x.fillText(current.sub,540,900);x.fillStyle="#d8daf0";x.font="29px sans-serif";x.fillText("月明かりの心の旅｜深層心理テスト",540,1120);x.fillStyle="#b8bddc";x.font="25px sans-serif";x.fillText("あなたの心にある、小さな光。",540,1185);x.strokeStyle="#eee6ff77";x.lineWidth=2;x.strokeRect(42,42,996,1266);c.toBlob(resolve,"image/png")})}
function download(blob){let u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="月明かりの心の旅_診断結果.png";a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
$("save").onclick=async()=>download(await cardBlob());
$("share").onclick=async()=>{let b=await cardBlob(),f=new File([b],"kokoro-shindan.png",{type:"image/png"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"月明かりの心の旅",text:`私の診断結果は「${current.name}」でした ✦`});return}catch(e){if(e.name==="AbortError")return}}download(b);alert("診断画像を保存したよ！写真アプリからXの投稿に添付してね。")};
$("post").onclick=()=>{let t=`私の深層心理タイプは「${current.name}」でした ✦\n${current.sub}\nあなたも診断してみてね！\n${location.href}\n#月明かりの心の旅 #心理テスト`;window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t),"_blank","noopener")};
</script></body></html>
